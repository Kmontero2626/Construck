<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- META -->
    <meta charset="UTF-8">  
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name=""viewport" content="width=device-width, initial-scale=1.0" />
    <!--  -->
    <title>Calendario</title>
    <base target="_top"/>
    <link rel="stylesheet" href="Stylessheet.css"/>    
 
  </head>
  <body>

    <!-- 1. ENCABEZADO DE LA PAGINA -->
    <div class="EncabezadoPagina">
      <div class="logoCompañia">
        <img src="LogoEmpresa.png">
      </div>
      <div class="interaccionSeccion1">
        <button type="button" class="BotonSeccion1">
          <img src="botonRegresar_cal1.png" class="imagenBotonSC1">
        </button>
      </div>
      
    </div>

    <!-- 2. TITULO DE SECCION -->
 

    <!-- 3. CUERPO DE LA PAGINA -->
    <div class="navegacion"  >
      <div class ="container">
        <div class="left">
            <div class="calendar">
                <div class="month">
                    <i class="fa fa-angle-left prev"></i>
                    <div class="date">Noviembre 2022</div>
                    <i class="fa fa-angle-right next"></i>
                </div>
                <div class ="weekdays">
                    <div>sun</div>
                    <div>mon</div>
                    <div>tue</div>
                    <div>wed</div>
                    <div>thu</div>
                    <div>fri</div>
                    <div>sat</div>
                </div>
                <div class="days">
                    <!-- los dias del calendario los voy a poner por JS-->              
                  <div class="day prev-date">30</div>
                  <div class="day prev-date">31</div>
                  <div class="day">1</div>
                  <div class="day">2</div>
                  <div class="day">3</div>
                  <div class="day event">4</div>
                  <div class="day">5</div>
                  <div class="day">6</div>
                  <div class="day">7</div>
                  <div class="day">8</div>
                  <div class="day">9</div>
                  <div class="day">10</div>
                  <div class="day">11</div> 
                  <div class="day">12</div>
                  <div class="day">13</div>
                  <div class="day">14</div>
                  <div class="day active event">15</div>
                  <div class="day">16</div>
                  <div class="day">17</div>
                  <div class="day today">18</div>
                  <div class="day">19</div>
                  <div class="day">20</div>
                  <div class="day">21</div>
                  <div class="day event">22</div>
                  <div class="day">23</div>
                  <div class="day">24</div>
                  <div class="day">25</div>
                  <div class="day">26</div>
                  <div class="day">27</div>
                  <div class="day">28</div>
                  <div class="day">29</div>
                  <div class="day">30</div>
                  <div class="day next-date">1</div>
                  <div class="day next-date">2</div>
                  <div class="day next-date">3</div>
                </div>
                <div class="goto-today">
                    <div class="goto">
                        <input type="text"placeholder="mm/yyyy" class="date-input"/>
                        <button class="goto-btn">go</button>
                    </div>
                    <button class="today-btn">today</button>

                </div>
            </div>
        </div>
        <div class="rigth">
          <div class="resumenServicios">
            <div class="servicioNumero">
              <input type="checkbox" id="cbServicio1" value="valuecbServicio1" class="cbServicio" >
              <h1 class="nombreServicioSeleccionado">servicio 1</h1>
              <h2 class="cantidadServicioSeleccionado">##</h2> <br>  
              <h3 class="fechaProgramacionServicioSeleccionado">dd/mm/aaaa</h3>
              <h4 class="subTotalServicioSeleccionado">$ 100.000</h4>
            </div>
            <div class="servicioNumero">
              <input type="checkbox" id="cbServicio1" value="valuecbServicio1" class="cbServicio" >
              <h1 class="nombreServicioSeleccionado">servicio 2</h1>
              <h2 class="cantidadServicioSeleccionado">##</h2> <br>  
              <h3 class="fechaProgramacionServicioSeleccionado">dd/mm/aaaa</h3>
              <h4 class="subTotalServicioSeleccionado">$ 100.000</h4>
            </div>
            <div class="servicioNumero">
              <input type="checkbox" id="cbServicio1" value="valuecbServicio1" class="cbServicio" >
              <h1 class="nombreServicioSeleccionado">servicio 3</h1>
              <h2 class="cantidadServicioSeleccionado">##</h2> <br>  
              <h3 class="fechaProgramacionServicioSeleccionado">dd/mm/aaaa</h3>
              <h4 class="subTotalServicioSeleccionado">$ 100.000</h4>
            </div>
            <div class="total">

            </div>
            
            <div class="totalValorServicios">
              <h1>Total:  500000</h1>
            </div>


          </div>
     
        </div>
      </div>
      
      <div class="interaccionSeccion2">
        <button type="button" class="Boton1InteraccionSeccion2" id="botonInteraccionSeccion2">
          <img src="Pagar.png" class="imagenBotonSI2">
        </button>
      </div>

         

    </div>


    <!-- 4. PIE DE LA PAGINA -->
    <div class="piePagina">

        <button type="button" class="BotonPie" id="botonPie1">
          <img src="botonNosotros_FT.png" class="imagenBotonPP">
        </button>

        <button type="button" class="BotonPie" id="botonPie2">
          <img src="botonUbicacion_FT.png" class="imagenBotonPP">
        </button>

        <button type="button" class="BotonPie" id="botonPie3">
          <img src="contactenos_FT.png" class="imagenBotonPP">
        </button>

    </div>

   </div>
  
 
   <script src="JavaScript.js"></script>

  </body>
</html>
